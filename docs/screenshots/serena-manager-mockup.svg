<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized Serena Manager mockup</title>
  <desc id="desc">A polished Windows-style Serena Manager window with three fictional projects, a project status table, and outlined action buttons.</desc>
  <defs>
    <style>
      .ui { font-family: "Segoe UI", Arial, sans-serif; fill: #1f2937; }
      .title { font-size: 22px; font-weight: 600; }
      .head { font-size: 14px; font-weight: 600; fill: #374151; }
      .cell { font-size: 14px; }
      .small { font-size: 13px; }
      .button { font-size: 14px; font-weight: 500; }
    </style>
  </defs>
  <rect width="1180" height="560" fill="#f6f8fa"/>
  <rect x="20" y="20" width="1140" height="520" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="20" y="20" width="1140" height="52" rx="10" fill="#f8fafc"/>
  <path d="M20 72H1160" stroke="#d8e0e9"/>
  <text class="ui title" x="46" y="53">Serena Manager</text>

  <rect x="40" y="92" width="1100" height="366" rx="7" fill="#ffffff" stroke="#b8c5d3"/>
  <rect x="40" y="92" width="1100" height="40" rx="7" fill="#eef3f8"/>
  <path d="M40 132H1140" stroke="#d7e0e9"/>

  <g class="ui head">
    <text x="60" y="117">Project</text>
    <text x="265" y="117">Project Path</text>
    <text x="685" y="117">Serena</text>
    <text x="798" y="117">Tunnel</text>
    <text x="894" y="117">MCP Port</text>
    <text x="994" y="117">Health Port</text>
    <text x="1080" y="117">Status</text>
  </g>

  <rect x="56" y="148" width="1068" height="40" rx="2" fill="#dff5e6"/>
  <rect x="56" y="188" width="1068" height="40" fill="#ffffff"/>
  <rect x="56" y="228" width="1068" height="40" rx="2" fill="#fff7dc"/>
  <g class="ui cell">
    <text x="76" y="173">demo-app</text><text x="265" y="173">C:\Projects\demo-app</text><text x="685" y="173">RUNNING</text><text x="798" y="173">RUNNING</text><text x="912" y="173">18000</text><text x="1014" y="173">18100</text><text x="1078" y="173">RUNNING</text>
    <text x="76" y="213">example-api</text><text x="265" y="213">C:\Projects\example-api</text><text x="692" y="213">STOPPED</text><text x="805" y="213">STOPPED</text><text x="912" y="213">18001</text><text x="1014" y="213">18101</text><text x="1083" y="213">STOPPED</text>
    <text x="76" y="253">my-website</text><text x="265" y="253">C:\Projects\my-website</text><text x="685" y="253">RUNNING</text><text x="805" y="253">STOPPED</text><text x="912" y="253">18002</text><text x="1014" y="253">18102</text><text x="1083" y="253">PARTIAL</text>
  </g>

  <g fill="#f8fafc" stroke="#aebdcb">
    <rect x="62" y="408" width="92" height="34" rx="5"/>
    <rect x="166" y="408" width="74" height="34" rx="5"/>
    <rect x="252" y="408" width="74" height="34" rx="5"/>
    <rect x="338" y="408" width="91" height="34" rx="5"/>
    <rect x="441" y="408" width="83" height="34" rx="5"/>
    <rect x="536" y="408" width="69" height="34" rx="5"/>
  </g>
  <g class="ui button" text-anchor="middle">
    <text x="108" y="430">↻ Refresh</text>
    <text x="203" y="430">▶ Start</text>
    <text x="289" y="430">■ Stop</text>
    <text x="383" y="430">↻ Restart</text>
    <text x="482" y="430">⚙ Debug</text>
    <text x="571" y="430">▣ Log</text>
  </g>
  <text class="ui small" x="1062" y="430" text-anchor="end" fill="#64748b">3 projects</text>
</svg>
